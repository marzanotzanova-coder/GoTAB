<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoTAB — Вход</title>
<link rel="preload" href="images/logo.png" as="image">
<link rel="preload" href="images/mountain.png" as="image">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Arial', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fafcff 0%, #f6f3ff 35%, #eefcff 70%, #f8fffc 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  /* ── Floating math background ── */
  .math-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .math-item {
    position: absolute;
    color: #5a78ff;
    opacity: 0;
    font-size: 14px;
    font-style: italic;
    font-weight: 600;
    white-space: nowrap;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg);   opacity: 0; }
    8%   { opacity: 0.18; }
    90%  { opacity: 0.13; }
    100% { transform: translateY(-110vh) rotate(12deg); opacity: 0; }
  }

  /* ── Sparkle dots ── */
  .sp {
    position: absolute;
    opacity: 0.4;
    pointer-events: none;
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50%       { opacity: 0.7; transform: scale(1.3); }
  }

  /* ── Language selector ── */
  .lang-wrap {
    position: absolute;
    top: 18px;
    right: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    border: 1px solid rgba(90,120,255,0.14);
    box-shadow: 0 4px 16px rgba(90,120,255,0.07);
    z-index: 10;
  }
  .lang-wrap select {
    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: 600;
    color: #14213D;
    cursor: pointer;
    outline: none;
  }
  .lang-icon { color: #2F6BFF; }

  /* ── Center form ── */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 60px;
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 400px;
    padding: 0 20px;
  }

  .gotab-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .gotab-logo img {
    height: 160px;
    width: auto;
    mix-blend-mode: multiply;
  }

  .subtitle {
    font-size: 15px;
    margin-bottom: 32px;
    letter-spacing: 0.4px;
  }
  .subtitle .s-blue { color: #2F6BFF; }
  .subtitle .s-cyan { color: #20C9FF; }
  .subtitle .s-mint { color: #1DE9B6; }

  /* ── Form card ── */
  .form-card {
    width: 100%;
    background: rgba(255,255,255,0.92);
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 10px 40px rgba(90,120,255,0.08);
    padding: 28px 24px;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 14px;
  }
  .input-wrap .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #9CA3AF;
    pointer-events: none;
    display: flex;
    align-items: center;
  }
  .input-wrap .icon svg { width: 18px; height: 18px; }
  .input-wrap input {
    width: 100%;
    height: 52px;
    padding: 0 16px 0 44px;
    border: 1.5px solid rgba(90,120,255,0.16);
    border-radius: 16px;
    font-size: 15px;
    color: #14213D;
    background: rgba(255,255,255,0.9);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrap input:focus {
    border-color: #2F6BFF;
    box-shadow: 0 0 0 3px rgba(47,107,255,0.12);
  }
  .input-wrap input:focus + .icon svg,
  .input-wrap input:focus ~ .icon svg { color: #2F6BFF; }
  .input-wrap input::placeholder { color: #9CA3AF; }

  .eye-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    color: #9CA3AF;
    display: flex;
    align-items: center;
  }
  .eye-btn svg { width: 18px; height: 18px; }
  .eye-btn:hover { color: #2F6BFF; }

  .btn-main {
    display: block;
    width: 100%;
    height: 52px;
    margin-top: 6px;
    margin-bottom: 12px;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: white;
    background: linear-gradient(90deg, #2F6BFF 0%, #20C9FF 60%, #1DE9B6 100%);
    box-shadow: 0 8px 24px rgba(47,107,255,0.24);
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .btn-main:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(47,107,255,0.32); }

  .btn-back {
    display: block;
    width: 100%;
    height: 52px;
    border: 2px solid #2F6BFF;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #2F6BFF;
    background: white;
    transition: transform 0.18s;
  }
  .btn-back:hover { transform: translateY(-1px); background: rgba(47,107,255,0.04); }

  .error-msg {
    color: #EF4444;
    font-size: 13px;
    text-align: center;
    margin-top: 8px;
    min-height: 18px;
  }

  /* ── Mountain ── */
  .mountain-area {
    position: fixed;
    bottom: 56px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 1;
  }
  .mountain-area img {
    width: 440px;
    max-width: 90vw;
    mix-blend-mode: screen;
    animation: mountainFloat 6s ease-in-out infinite;
  }
  @keyframes mountainFloat {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-8px); }
  }

  @media (max-width: 480px) {
    .center { margin-top: 44px; }
  }

  /* ── Footer ── */
  .legal-footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    padding: 10px 20px;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(90,120,255,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .legal-footer-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px 14px;
  }
  .legal-footer-links a {
    color: #6B7280;
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    transition: color 0.15s;
  }
  .legal-footer-links a:hover { color: #2F6BFF; }
  .legal-footer-bottom {
    display: flex;
    gap: 16px;
    color: #9CA3AF;
    font-size: 11px;
  }
  .legal-footer-sep { color: #D1D5DB; font-size: 12px; }

  /* ── Contact Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,33,61,0.35);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 24px;
    padding: 32px 28px;
    max-width: 340px;
    width: calc(100% - 40px);
    box-shadow: 0 20px 60px rgba(47,107,255,0.16);
    text-align: center;
  }
  .modal-box h3 {
    font-size: 20px;
    font-weight: 800;
    background: linear-gradient(135deg, #2F6BFF, #1DE9B6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 18px;
  }
  .modal-box p { font-size: 14px; color: #374151; margin-bottom: 10px; line-height: 1.6; }
  .modal-box a { color: #2F6BFF; text-decoration: none; }
  .modal-box a:hover { text-decoration: underline; }
  .modal-close-btn {
    margin-top: 18px;
    padding: 10px 28px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #2F6BFF, #1DE9B6);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- Floating math background -->
<div class="math-bg" id="mathBg"></div>

<!-- Sparkle dots -->
<svg class="sp" style="top:8%;left:8%;width:14px;height:14px" viewBox="0 0 24 24" fill="#8A5CFF"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
<svg class="sp" style="top:15%;right:12%;width:10px;height:10px;animation-delay:1s" viewBox="0 0 24 24" fill="#20C9FF"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
<svg class="sp" style="top:28%;left:14%;width:8px;height:8px;animation-delay:2s" viewBox="0 0 24 24" fill="#8A5CFF"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
<svg class="sp" style="bottom:40%;right:16%;width:10px;height:10px;animation-delay:0.5s" viewBox="0 0 24 24" fill="#1DE9B6"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
<svg class="sp" style="bottom:35%;left:20%;width:8px;height:8px;animation-delay:1.5s" viewBox="0 0 24 24" fill="#20C9FF"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>

<!-- Language selector -->
<div class="lang-wrap">
  <svg class="lang-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
  <select id="langSelect">
    <option value="kk">Қазақша</option>
    <option value="ru">Русский</option>
  </select>
</div>

<div class="center">
  <div class="gotab-logo">
    <img src="images/logo.png" alt="GoTAB" fetchpriority="high">
  </div>

  <div class="form-card">
    <div class="input-wrap">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </span>
      <input type="text" id="phone" placeholder="Телефон нөмірі" data-i18n-placeholder="phonePh">
    </div>
    <div class="input-wrap">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </span>
      <input type="email" id="email" placeholder="Email">
    </div>
    <div class="input-wrap">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <input type="password" id="password" placeholder="Құпиясөз" data-i18n-placeholder="passwordPh">
      <button class="eye-btn" id="togglePass" type="button">
        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <button class="btn-main" id="loginBtn" data-i18n="loginBtn">Кіру</button>
    <button class="btn-back" id="backBtn" data-i18n="btnBack">← Артқа</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<div class="mountain-area">
  <img src="images/mountain.png" alt="" fetchpriority="high">
</div>

<!-- Contact Modal -->
<div class="modal-overlay" id="contactModal">
  <div class="modal-box">
    <h3 id="contactModalTitle">Байланыс</h3>
    <p>
      <svg style="width:14px;height:14px;vertical-align:middle;margin-right:4px" viewBox="0 0 24 24" fill="none" stroke="#2F6BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      <a href="mailto:support@gotab.kz">support@gotab.kz</a>
    </p>
    <p>
      <svg style="width:14px;height:14px;vertical-align:middle;margin-right:4px" viewBox="0 0 24 24" fill="none" stroke="#1DE9B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span id="contactModalWa">WhatsApp арқылы жазыңыз</span>
    </p>
    <button class="modal-close-btn" onclick="closeContact()" data-i18n="closeBtn">Жабу</button>
  </div>
</div>

<footer class="legal-footer">
  <div class="legal-footer-links">
    <a href="privacy.html" data-i18n="footerPrivacy">Құпиялылық</a>
    <span class="legal-footer-sep">·</span>
    <a href="terms.html" data-i18n="footerTerms">Шарттар</a>
    <span class="legal-footer-sep">·</span>
    <a href="cookies.html" data-i18n="footerCookies">Cookie</a>
    <span class="legal-footer-sep">·</span>
    <a href="#" onclick="openContact();return false;" data-i18n="footerContact">Байланыс</a>
  </div>
  <div class="legal-footer-bottom">
    <span>© 2026 GoTAB</span>
    <span>·</span>
    <span>v1.0.0</span>
  </div>
</footer>

<script src="lang.js"></script>
<script>
// Floating math formulas
(function(){
  const formulas = [
    'x²+y²=r²', 'a²+b²=c²', 'E=mc²', 'π≈3.14', '∫f(x)dx',
    'y=mx+b', '∑n(n+1)/2', '√(a²+b²)', 'sin²+cos²=1',
    'Δx/Δt', 'f\'(x)', 'log₂n', '2πr', 'ax²+bx+c=0',
    'P(A∪B)', 'n!', 'lim→∞', 'θ=arctan', 'V=πr²h',
    'α+β+γ=180°', 'S=½bh', 'F=ma', 'v=λf', 'Aₙ=A₀rⁿ'
  ];
  const colors = ['#5a78ff','#20C9FF','#1DE9B6','#8A5CFF','#2F6BFF'];
  const container = document.getElementById('mathBg');

  function spawn(){
    const el = document.createElement('span');
    el.className = 'math-item';
    el.textContent = formulas[Math.floor(Math.random()*formulas.length)];
    el.style.left = Math.random()*95 + '%';
    el.style.bottom = '-30px';
    el.style.fontSize = (12 + Math.random()*10) + 'px';
    el.style.color = colors[Math.floor(Math.random()*colors.length)];
    const dur = 12 + Math.random()*16;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = '0s';
    container.appendChild(el);
    setTimeout(() => el.remove(), dur*1000);
  }

  // Initial burst
  for(let i=0;i<12;i++){
    setTimeout(spawn, i*400);
  }
  setInterval(spawn, 1200);
})();

function openContact()  { document.getElementById("contactModal").classList.add("open"); }
function closeContact() { document.getElementById("contactModal").classList.remove("open"); }
document.getElementById("contactModal").addEventListener("click", function(e){
  if(e.target===this) closeContact();
});

(function(){
  const langSelect = document.getElementById("langSelect");

  // Eye toggle
  const eyeOpen = `<svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const eyeClosed = `<svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

  document.getElementById("togglePass").addEventListener("click", () => {
    const p = document.getElementById("password");
    const btn = document.getElementById("togglePass");
    if(p.type === "password"){
      p.type = "text";
      btn.innerHTML = eyeClosed;
    } else {
      p.type = "password";
      btn.innerHTML = eyeOpen;
    }
  });

  document.getElementById("backBtn").addEventListener("click", () => { window.location.href = "index.html"; });

  const errorMsg = document.getElementById("errorMsg");

  document.getElementById("loginBtn").addEventListener("click", async () => {
    const phone    = document.getElementById("phone").value.trim();
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const lang     = langSelect.value;
    errorMsg.textContent = "";

    if(!phone || !password){
      errorMsg.textContent = lang==="ru" ? "Заполните все поля" : "Барлық өрістерді толтырыңыз";
      return;
    }

    try{
      if(email){
        const r = await fetch("/api/auth/login",{
          method:"POST", headers:{"Content-Type":"application/json"},
          credentials:"include", cache:"no-store",
          body: JSON.stringify({role:"admin", email, password})
        });
        const j = await r.json().catch(()=>null);
        if(r.ok && j?.ok){ window.location.href="admin.html"; return; }
      }

      const r = await fetch("/api/auth/login",{
        method:"POST", headers:{"Content-Type":"application/json"},
        credentials:"include", cache:"no-store",
        body: JSON.stringify({role:"student", phone, password})
      });
      const j = await r.json().catch(()=>null);
      if(!r.ok || !j?.ok){
        errorMsg.textContent = lang==="ru" ? "Неверный телефон или пароль" : "Телефон немесе пароль қате";
        return;
      }
      window.location.href = "dashboard.html";
    }catch(e){
      errorMsg.textContent = lang==="ru" ? "Ошибка сервера" : "Сервер байланыспады";
    }
  });
})();
</script>
</body>
</html>
